name: Publish beta
on:
  push:
    branches: [main]
    paths:
      - Info.plist
      - .github/workflows/publish-beta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isla-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate source
        run: python3 scripts/check-repository.py
      - name: Compile, test and package
        run: bash scripts/package.sh
      - name: Publish a new beta version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISLA_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          ISLA_TAG="v$ISLA_VERSION"
          if gh release view "$ISLA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $ISLA_TAG already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$ISLA_TAG" \
            "dist/ISLA-$ISLA_VERSION-macOS-universal.zip" \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ISLA $ISLA_VERSION — Beta" \
            --notes-file "docs/releases/$ISLA_TAG.md" \
            --prerelease
